dependencies = [
  "fastapi==0.143.0", "starlette==1.8.0", "uvicorn==0.34.2", "SQLAlchemy==2.0.40", "alembic==1.15.2",
  "psycopg[binary]==3.2.9", "authlib==1.8.0", "cryptography==50.0.2", "httpx==0.28.1",
  "openai==1.78.1", "tiktoken==0.9.0", "pypdf==6.20.1", "pypdfium2==5.13.0", "python-docx==1.2.0", "PyYAML==6.0.3", "openpyxl==3.1.5", "beautifulsoup4==4.13.4",
  "pillow==12.3.0", "boto3==1.38.16", "jsonschema==4.23.0", "python-multipart==0.0.32",
